<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Spring Boot & Thymeleaf</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }
        .badge {
            display: inline-block;
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 28px;
            color: #1a1a1a;
            margin-bottom: 12px;
        }
        p.subtitle {
            font-size: 16px;
            color: #555555;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .info-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 28px;
            text-align: left;
        }
        .info-box .item {
            margin-bottom: 8px;
            font-size: 14px;
        }
        .info-box .item:last-child {
            margin-bottom: 0;
        }
        .info-box .label {
            font-weight: 600;
            color: #64748b;
            display: inline-block;
            width: 100px;
        }
        .info-box .value {
            color: #0f172a;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .btn {
            display: inline-block;
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease-in-out;
        }
        .btn-primary {
            background-color: #2e7d32;
            color: #ffffff;
        }
        .btn-primary:hover {
            background-color: #1b5e20;
        }
        .btn-secondary {
            background-color: #f1f5f9;
            color: #334155;
            border: 1px solid #cbd5e1;
        }
        .btn-secondary:hover {
            background-color: #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="badge">Spring Boot + Thymeleaf</span>
        <h1 th:text="${greeting}">안녕하세요! 반갑습니다.</h1>
        <p class="subtitle" th:text="${message}">Spring Boot와 Thymeleaf를 연동한 기본 웹 화면입니다.</p>

        <div class="info-box">
            <div class="item">
                <span class="label">템플릿 엔진</span>
                <span class="value">Thymeleaf 3.x</span>
            </div>
            <div class="item">
                <span class="label">서버 확인 시간</span>
                <span class="value" th:text="${serverTime}">2026-09-17 13:00:00</span>
            </div>
            <div class="item">
                <span class="label">접속 경로</span>
                <span class="value">GET /</span>
            </div>
        </div>

        <div class="btn-group">
            <a href="/" class="btn btn-primary">새로고침</a>
            <a href="/test" class="btn btn-secondary">/test 페이지 이동</a>
        </div>
    </div>
</body>
</html>
